#
# CI: Linux test suite against real 7-Zip, a short libFuzzer run, and the
# Windows DLLs + installer (MinGW-w64 and NSIS on Linux).
#
# Every job runs in an ubuntu:26.04 container: that release packages 7-Zip
# 26.00, the version the plugin and its tests are checked against.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  LANG: C.UTF-8 # 7-Zip needs a UTF-8 locale for the Unicode file name tests
  LC_ALL: C.UTF-8
  # 7-Zip source: the Linux plugin build and the handler test need its headers
  # and Common/MyWindows.cpp.  Pinned by hash.
  SEVENZIP_SRC_URL: https://www.7-zip.org/a/7z2600-src.tar.xz
  SEVENZIP_SRC_SHA256: 3e596155744af055a77fc433c703d54e3ea9212246287b5b1436a6beac060f16

jobs:
  test:
    name: Tests (unit, handler, core, 7-Zip plugin)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ubuntu:26.04
      options: --cap-add=SYS_PTRACE # LeakSanitizer stops threads with ptrace
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils make g++ python3 dosfstools 7zip
      - uses: actions/checkout@v4
      - name: Fetch 7-Zip source
        run: |
          curl -fsSL -o /tmp/7zsrc.tar.xz "$SEVENZIP_SRC_URL"
          echo "$SEVENZIP_SRC_SHA256  /tmp/7zsrc.tar.xz" | sha256sum -c -
          mkdir -p /opt/7zsrc
          tar -xJf /tmp/7zsrc.tar.xz -C /opt/7zsrc
      - name: Build and run the test suite
        run: make test SRC7Z=/opt/7zsrc/CPP
      - name: Keep test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            build/coretest
            build/plugtest
            build/fuzz-crash.img
          if-no-files-found: ignore

  fuzz:
    name: Fuzz (libFuzzer, ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ubuntu:26.04
      options: --cap-add=SYS_PTRACE
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git make clang libclang-rt-dev
      - uses: actions/checkout@v4
      - name: Fuzz
        # Replays tests/fuzz_regress first.  Limits per input: 5 s, 512 MB RSS,
        # 128 MB per allocation (see Makefile).
        run: make fuzz FUZZ_RUNS=30000 FUZZ_SEED=${{ github.run_number }}
      - name: Keep failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failure
          path: |
            build/crash-*
            build/oom-*
            build/timeout-*
            build/fuzz-crash.img
          if-no-files-found: ignore

  windows:
    name: Windows DLLs and installer (MinGW-w64, NSIS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: ubuntu:26.04
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git make g++ g++-mingw-w64-i686 g++-mingw-w64-x86-64 binutils-mingw-w64 nsis
      - uses: actions/checkout@v4
      - name: Lint (GCC and MinGW warnings as errors)
        run: make lint
      - name: Build DLLs and installer
        run: make installer
      - uses: actions/upload-artifact@v4
        with:
          name: fat12-windows
          path: dist/
          if-no-files-found: error

  # Publishes a GitHub Release when a version tag (v1.2.3) is pushed and every
  # other job passed.  Ordinary pushes stop after the jobs above.
  #   git tag v1.0.0 && git push origin v1.0.0
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, fuzz, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against src/version.h
        run: |
          ver=$(sed -n 's/^#define FAT12_VER_STR "\(.*\)"$/\1/p' src/version.h)
          if [ "v$ver" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $ver in src/version.h"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: fat12-windows
          path: dist
      - name: Collect release files
        run: |
          ver=${GITHUB_REF_NAME#v}
          mkdir release
          cp "dist/fat12-7zip-plugin-$ver-setup.exe" release/
          # DLLs for installing by hand: x64/fat12.dll and x86/fat12.dll
          (cd dist && zip -r "../release/fat12-7zip-plugin-$ver-dll.zip" x64/fat12.dll x86/fat12.dll)
          (cd release && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "FAT12 plugin for 7-Zip ${GITHUB_REF_NAME#v}" --generate-notes
